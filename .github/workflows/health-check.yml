name: Health Check & Keep-Alive

on:
  schedule:
    # Every 6 hours — periodic health monitoring.
    # NOTE: GitHub does not reliably run crons more often than ~hourly
    # (a previous */10 schedule was throttled to ~7 runs/day anyway).
    # For actual Render free-tier keep-alive (15-min idle timeout), use a
    # free external pinger such as cron-job.org or UptimeRobot — zero
    # Actions minutes and far more reliable.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Cancel superseded runs — delayed scheduled pings would otherwise stack up.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    name: Ping production endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Pinging Bargain API..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.bargainhuntrs.com/health || echo "000")
          echo "API health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API health check failed ($STATUS)"
          fi

      - name: Ping Web
        run: |
          echo "Pinging Bargain web..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://bargain-web.onrender.com || echo "000")
          echo "Web health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web health check failed ($STATUS)"
          fi

      - name: Ping custom domain
        run: |
          echo "Pinging www.bargainhuntrs.com..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://www.bargainhuntrs.com || echo "000")
          echo "Web (www): $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web www health check failed ($STATUS)"
          fi
