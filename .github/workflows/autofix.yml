name: Auto-Fix

# Self-healing CI layer — runs on every push to a PR branch.
# 1. Runs ESLint --fix across bargain-web TS/TSX files
# 2. Python syntax check on bargain-api
# 3. Runs TypeScript typecheck (non-blocking — errors uploaded as artifacts)
# 4. If ESLint made changes, commits them back to the PR branch automatically

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions:
  contents: write   # needed to push fixup commits back to the branch
  pull-requests: write

jobs:
  autofix:
    name: ESLint + Python Autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint autofix — bargain-web
        run: |
          cd bargain-web
          pnpm exec eslint "src/**/*.{ts,tsx}" --fix --no-error-on-unmatched-pattern 2>&1 || true

      - name: Python syntax check — bargain-api (blocking)
        run: |
          cd bargain-api
          find app -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: TypeScript check — bargain-web (non-blocking)
        run: |
          cd bargain-web
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc-web.log || true

      - name: Upload TypeScript error logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsc-errors-${{ github.run_number }}
          path: /tmp/tsc-*.log
          retention-days: 7

      - name: Commit autofix changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: ESLint autofix [skip ci]"
          commit_options: "--no-verify"
          file_pattern: "**/*.ts **/*.tsx"
          skip_dirty_check: false
          skip_fetch: false
