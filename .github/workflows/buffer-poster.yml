name: Buffer Auto-Poster

on:
  schedule:
    # 9:00 AM, 1:00 PM, 5:00 PM ET (13:00, 17:00, 21:00 UTC during EDT)
    # GitHub Actions cron runs in UTC. ET is UTC-4 (EDT, Mar-Nov) or UTC-5 (EST, Nov-Mar).
    # These times are approximate but close enough — the key is regular posting.
    - cron: '0 13,17,21 * * *'
  workflow_dispatch:

# Never run two posting cycles at once — delayed scheduled runs
# would otherwise overlap and double-post.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-and-post:
    name: Scrape Impact deals & post to X
    runs-on: ubuntu-latest
    steps:
      - name: Scrape Impact.com deals
        run: |
          echo "Scraping Impact.com deals at $(date -u)"

          # Fetch discounted products and promo codes from joined Impact
          # campaigns and save them to the database with affiliate links.
          # No auth required — public endpoint.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            --max-time 120 \
            --retry 2 \
            --retry-delay 10 \
            "https://api.bargainhuntrs.com/api/v1/arbitrage/deals/scrape-impact/public")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Impact scrape HTTP Status: $HTTP_CODE"
          echo "Impact scrape response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Impact scrape returned HTTP $HTTP_CODE — continuing to post existing deals"
          fi

      - name: Post new deals to X via Buffer
        run: |
          echo "Triggering deal posting at $(date -u)"

          # The post-new-to-x/public endpoint posts already-scraped deals
          # that have affiliate links. No auth required.
          # Posting fans out to X/FB/IG/Buffer sequentially and can exceed
          # 5min on a cold backend — use a 9min cap and drop --retry (retrying
          # a slow POST just re-runs the whole post cycle).
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            --max-time 540 \
            "https://api.bargainhuntrs.com/api/v1/arbitrage/deals/post-new-to-x/public?max_posts=5" \
            || echo -e "\n000")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          # Always report the outcome to the step summary so a run that
          # published nothing can never pass silently behind a green check.
          {
            echo "## Buffer poster run — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- HTTP status: \`$HTTP_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP_CODE" != "200" ]; then
            # Hard-fail: a non-200 means zero posts were published, and a
            # green checkmark must never claim a successful posting cycle.
            echo "- **Result: FAILED** — API returned HTTP $HTTP_CODE, 0 posts published" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deal posting returned HTTP $HTTP_CODE — zero posts published. Backend health: see health-check.yml"
            exit 1
          fi

          # Parse the posted count + skip reasons from the response
          PARSED=$(echo "$BODY" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          print(d.get('posted', 0), d.get('skipped_no_image', 0), d.get('skipped_non_english', 0), d.get('skipped_dedup', 0))
          " 2>/dev/null || echo "0 0 0 0")
          read POSTED SKIP_IMG SKIP_LANG SKIP_DEDUP <<< "$PARSED"

          {
            echo "- Posts published: **$POSTED**"
            echo "- Skipped — no image: $SKIP_IMG, non-English: $SKIP_LANG, recent dedup: $SKIP_DEDUP"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deals posted: $POSTED (skipped: ${SKIP_IMG} no-image, ${SKIP_LANG} non-English, ${SKIP_DEDUP} dedup)"

          if [ "$POSTED" -eq 0 ]; then
            echo "- **Result: FAILED** — 0 posts published" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Zero deals published this cycle (skipped: ${SKIP_IMG} no-image, ${SKIP_LANG} non-English, ${SKIP_DEDUP} dedup). Check scraper output + Buffer/channel config."
            exit 1
          fi

          echo "- **Result: OK** — $POSTED post(s) published" >> "$GITHUB_STEP_SUMMARY"
          echo "Deal posting cycle completed successfully"
