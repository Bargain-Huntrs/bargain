name: Health Check & Keep-Alive

on:
  schedule:
    # Every 6 hours — periodic health monitoring.
    # NOTE: GitHub does not reliably run crons more often than ~hourly
    # (a previous */10 schedule was throttled to ~7 runs/day anyway).
    # For actual Render free-tier keep-alive (15-min idle timeout), use a
    # free external pinger such as cron-job.org or UptimeRobot — zero
    # Actions minutes and far more reliable.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Cancel superseded runs — delayed scheduled pings would otherwise stack up.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    name: Ping production endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Pinging Bargain API..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.bargainhuntrs.com/health || echo "000")
          echo "API health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API health check failed ($STATUS)"
          fi

      - name: Ping API Render origin
        run: |
          echo "Pinging API Render origin (bargain-api-1o0n)..."
          # NOTE: the real Render subdomain is bargain-api-1o0n.onrender.com —
          # Render appends a random suffix. bargain-api.onrender.com is NOT
          # this service and correctly returns 404 (x-render-routing: no-server).
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://bargain-api-1o0n.onrender.com/health || echo "000")
          echo "API origin health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API origin health check failed ($STATUS)"
          fi

      - name: Ping Web (Cloudflare Workers)
        run: |
          echo "Pinging Bargain web (workers.dev)..."
          # Frontend lives on Cloudflare Workers; the old Render bargain-web
          # service is suspended — do not ping it.
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://bargain-web.bargain4huntrs.workers.dev || echo "000")
          echo "Web health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web health check failed ($STATUS)"
          fi

      - name: Ping custom domain
        run: |
          echo "Pinging www.bargainhuntrs.com..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://www.bargainhuntrs.com || echo "000")
          echo "Web (www): $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web www health check failed ($STATUS)"
          fi
